name: CI
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Forbid @ts-nocheck
        run: |
          if grep -rn "@ts-nocheck" src/; then
            echo "::error::@ts-nocheck is not allowed — fix the types instead"
            exit 1
          fi
      - run: npm run build
      - run: npm test
